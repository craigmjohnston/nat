name: CI

on:
  push:
    branches: [main]
  pull_request:

# The two halves of the gate run as jobs of their own, side by side: a lint
# failure and a test failure are different things to go and fix, and a run that
# reports both at once is worth the second checkout.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: true

      # After the upload, so a run that fails here has still reported what it
      # did cover. The profile is read rather than the percentage `go test`
      # prints, which rounds a single missed statement away — see the script.
      - name: No uncovered statements
        run: ./scripts/no-uncovered.sh coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"

      # The version is pinned: a linter that updates itself fails pull requests
      # that changed nothing, on a rule that did not exist when they were
      # written. Raising it is its own change, made deliberately.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
