name: macOS App CI

on:
  push:
    branches: [main]
    paths: [macos/**, .github/workflows/macos.yml]
  pull_request:
    paths: [macos/**, .github/workflows/macos.yml]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: swift test --package-path macos

      - name: Build
        run: swift build --package-path macos
